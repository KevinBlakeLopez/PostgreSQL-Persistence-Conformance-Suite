# Go adapters on GitHub Actions
#
# Runs the pgx control, the database/sql control, and the GORM adapter against the disposable PostgreSQL 18.6 server.
# It does not change the JavaScript suite job. That job stays filtered to Lucid, MikroORM, TypeORM, and pg-control.

name: go

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: adapters/go/go.mod
      - name: pnpm 12.8.1, from package.json's packageManager
        run: corepack enable && pnpm --version
      - name: Install the harness
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test the Go module from the lockfile
        working-directory: adapters/go
        run: go test ./...
      - name: Start the disposable server
        run: pnpm run pg:up
      - name: Go adapters
        # Compared with the recorded run, so an adapter that does not start, or any changed
        # classification, fails the job instead of leaving INCONCLUSIVE rows in a passing run.
        run: node harness/run.mjs --adapter=go-pgx-control,go-database-sql-control,gorm --repeat=3 --expect=reports/examples/2026-10-22T13-24-28Z-606909/run.json
      - name: Keep the Go evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ppcs-go-results
          path: results/
          if-no-files-found: ignore
      - name: Remove the server
        if: always()
        run: pnpm run pg:down

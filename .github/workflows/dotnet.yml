# .NET adapters on GitHub Actions
#
# Runs the Npgsql control and the EF Core adapter against the disposable PostgreSQL 18.6 server.
# It does not change the JavaScript suite job. That job stays filtered to Lucid, MikroORM, TypeORM, and pg-control.

name: dotnet

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - name: pnpm 12.8.1, from package.json's packageManager
        run: corepack enable && pnpm --version
      - name: Install the harness
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the .NET adapters from the lockfiles
        run: |
          dotnet build -c Release adapters/npgsql-control/Ppcs.NpgsqlControl.csproj
          dotnet build -c Release adapters/efcore/Ppcs.EfCore.csproj
          dotnet test -c Release adapters/npgsql-control/test/Ppcs.NpgsqlControl.Tests.csproj --nologo
          dotnet test -c Release adapters/efcore/test/Ppcs.EfCore.Tests.csproj --nologo
      - name: Start the disposable server
        run: pnpm run pg:up
      - name: .NET adapters
        # Compared with the recorded run, so an adapter that does not start, or any changed
        # classification, fails the job instead of leaving INCONCLUSIVE rows in a passing run.
        run: node harness/run.mjs --adapter=npgsql-control,efcore --repeat=3 --expect=reports/examples/2026-10-24T14-30-51Z-855e81/run.json
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ppcs-dotnet-results
          path: results/
          if-no-files-found: ignore
      - name: Remove the server
        if: always()
        run: pnpm run pg:down

# Runs the methodology tests and the whole suite on a disposable PostgreSQL server, and fails if any classification
# differs from the recorded run in reports/examples. Third-party actions are pinned by commit.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.1
      - name: pnpm 12.8.1, from package.json's packageManager
        run: corepack enable && pnpm --version
      - name: Install from the committed lockfiles
        run: pnpm run setup
      - name: Classification rules (no database)
        run: pnpm run test
      - name: Start the disposable server
        run: pnpm run pg:up
      - name: Methodology tests (controls and fixtures through the real runner)
        run: pnpm run test:methodology
      - name: Whole suite, compared with the recorded run
        # That file records Lucid, MikroORM, TypeORM, and pg-control. An unfiltered
        # run adds later adapters, and compareWith treats every new row as a difference.
        run: node harness/run.mjs --adapter=lucid,mikroorm,typeorm,pg-control --expect=reports/examples/2026-10-22T01-26-51Z-fb52c8/run.json
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ppcs-results
          path: results/
          if-no-files-found: ignore
      - name: Remove the server
        if: always()
        run: pnpm run pg:down

  php:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.1
      - name: pnpm 12.8.1, from package.json's packageManager
        run: corepack enable && pnpm --version
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # master, 2026-10-21
        with:
          php-version: '8.5.12'
          extensions: pdo_pgsql
          tools: composer
          coverage: none
      - name: Install the harness and the JavaScript adapters
        run: pnpm run setup
      - name: Install the PHP adapters from the lockfile
        run: composer install --no-interaction --no-scripts --working-dir=adapters/php
      - name: Start the disposable server
        run: pnpm run pg:up
      - name: PHP adapters
        # Compared with the PHP 8.5.12 recording, so a runtime the adapters refuse, or any changed
        # classification, fails the job instead of leaving INCONCLUSIVE rows in a passing run.
        run: node harness/run.mjs --adapter=pdo-control,laravel --repeat=3 --expect=reports/examples/2026-10-23T14-18-35Z-5a6ff7/run.json
      - name: Keep the PHP evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ppcs-php-results
          path: results/
          if-no-files-found: ignore
      - name: Remove the server
        if: always()
        run: pnpm run pg:down

  jooq:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.1
      - name: pnpm 12.8.1, from package.json's packageManager
        run: corepack enable && pnpm --version
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Maven
        run: sudo apt-get update && sudo apt-get install -y maven
      - name: Install the harness and the JavaScript adapters
        run: pnpm run setup
      - name: Build the jOOQ adapter
        run: mvn -B -f adapters/jooq/pom.xml package
      - name: Start the disposable server
        run: pnpm run pg:up
      - name: jOOQ adapter
        run: node harness/run.mjs --adapter=jooq --repeat=3
      - name: Keep the jOOQ evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ppcs-jooq-results
          path: results/
          if-no-files-found: ignore
      - name: Remove the server
        if: always()
        run: pnpm run pg:down

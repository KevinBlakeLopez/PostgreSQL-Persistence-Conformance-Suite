# The disposable PostgreSQL server PPCS runs against. Start it with `pnpm run pg:up`, which supplies the variables below.
#
# - The image is pinned by digest: the multi-platform index of postgres:18.6, which is also the image the reused
#   experiments ran on (docs/provenance.md).
# - cluster_name is set to a random token per start. The runner refuses any server whose cluster_name does not match the
#   token in .ppcs-instance.json, so it cannot be pointed at another database by accident.
# - The data directory is a tmpfs: nothing outlives the container.
# - The port is bound to 127.0.0.1 only. The password is random per start and is never written to results.
name: ppcs

services:
  postgres:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    container_name: ppcs-postgres
    labels:
      purpose: ppcs-disposable
    environment:
      POSTGRES_PASSWORD: ${PPCS_PGPASSWORD:?start the server with scripts/pg-up.sh}
    command:
      - postgres
      - -c
      - cluster_name=${PPCS_INSTANCE_TOKEN:?start the server with scripts/pg-up.sh}
      - -c
      - max_connections=100
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
    ports:
      - 127.0.0.1:${PPCS_PGPORT:-55435}:5432
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      # TCP, not the Unix socket: the temporary server the entrypoint runs during initialisation listens only on the
      # socket, so this succeeds only once the real server is up.
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U postgres -tAc 'select 1' >/dev/null"]
      interval: 1s
      timeout: 5s
      retries: 90

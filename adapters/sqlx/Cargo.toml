[package]
name = "ppcs-sqlx"
version = "0.1.0"
edition = "2021"
publish = false
description = "PPCS adapter for SQLx's PostgreSQL driver"

[dependencies]
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
serde_json = "=1.0.154"
